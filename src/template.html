<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{URL}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    document.documentElement.classList.add('js');
    try {
      var t = localStorage.theme;
      if (t === 'paper' || t === 'blueprint' || t === 'graphite' || t === 'midnight') {
        document.documentElement.dataset.theme = t;
      }
      if ({{BOOT_ON}} && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var q = new URLSearchParams(location.search);
        var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
        var reload = !!nav && nav.type === 'reload';
        if (q.has('boot') || (!q.has('noboot') && (reload || !sessionStorage.getItem('booted')))) {
          document.documentElement.classList.add('booting');
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          if (reload && location.hash) history.replaceState(null, '', location.pathname + location.search);
          if (reload || !location.hash) document.documentElement.classList.add('boot-top');
        }
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Figtree:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v={{ASSET_V}}">
  <script type="application/ld+json">
{{JSONLD}}
  </script>
  <script src="boot.js?v={{ASSET_V}}" defer></script>
  <script src="ascii.js?v={{ASSET_V}}" defer></script>
  <script src="carousel.js?v={{ASSET_V}}" defer></script>
  <script src="app.js?v={{ASSET_V}}" defer></script>
</head>
<body>

  <div class="progress" aria-hidden="true"><i></i></div>
  <div class="rail" aria-hidden="true">{{RAIL}}</div>

  <!-- ═══════════ MASTHEAD ═══════════ -->
  <header class="masthead">
    <div class="mast-inner">
      <a class="mast-name" href="#top">Aakash <em>Shah.</em></a>
      <nav class="mast-nav" aria-label="Section navigation">
{{NAV_LINKS}}
        <a class="mast-pill" href="#contact">Get in touch ↗</a>
        <button type="button" class="theme-btn" aria-label="Colour theme: Paper. Click to change."><span aria-hidden="true"></span></button>
      </nav>
    </div>
  </header>

  <main>

    <!-- ═══════════ HERO ═══════════ -->
    <section class="hero" id="top">
      <div class="container hero-grid">
{{HERO}}
      </div>
    </section>

    <!-- ═══════════ PROOF MARQUEE ═══════════ -->
    <div class="marquee">
      <div class="mq-track">
{{MARQUEE}}
      </div>
    </div>

{{SECTIONS}}

  </main>

  <!-- ═══════════ COLOPHON ═══════════ -->
  <footer>
    <div class="container">
      <p class="colophon">{{COLOPHON}}</p>
    </div>
  </footer>


  <canvas class="cursor-field" aria-hidden="true"></canvas>

{{BOOT}}

{{EGG}}
{{ART}}

</body>
</html>
