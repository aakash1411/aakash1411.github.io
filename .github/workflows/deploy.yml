name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild picks up new Substack/Medium posts.
    # ponytail: GitHub pauses scheduled workflows after 60 days with no repo activity; re-enable in the Actions tab or push any commit.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test content parser
        run: node --test
      - name: Build site (validates content)
        run: node build.js
        env:
          FORBIDDEN: ${{ secrets.FORBIDDEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
